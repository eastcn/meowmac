<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MeowMac 设置菜单</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;color:#1D1D1F;-webkit-font-smoothing:antialiased}
a{color:#0A6CFF}a:hover{color:#0050C8}
</style>
</helmet>
<div style="width: 260px; height: 200px; box-sizing: border-box; background: linear-gradient(rgba(250,250,252,0.74), rgba(250,250,252,0.74)), linear-gradient(135deg, #9DB4F0 0%, #D3B5EC 55%, #F5C3CF 100%); padding: 6px; display: flex; flex-direction: column;">
  <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
    <sc-if value="{{it.sep}}" hint-placeholder-val="{{false}}">
      <div style="height: 1px; background: rgba(0,0,0,0.1); margin: 5px 8px;"></div>
    </sc-if>
    <sc-if value="{{it.row}}" hint-placeholder-val="{{true}}">
      <button type="button" style="border: none; background: transparent; font: inherit; font-size: 13px; color: {{it.color}}; height: 26px; padding: 0 8px; border-radius: 5px; display: flex; align-items: center; gap: 6px; text-align: left;">
        <span style="width: 12px; font-size: 12px;">{{it.check}}</span>
        <span style="flex-grow: 1;">{{it.label}}</span>
        <span style="font-size: 12px; color: #8E8E93;">{{it.hint}}</span>
      </button>
    </sc-if>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":260,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (label, hint, check, color) => ({ row: true, sep: false, label, hint: hint || '', check: check || '', color: color || '#1D1D1F' });
    const sep = { row: false, sep: true };
    return {
      items: [
        row('打开配置文件…', ''),
        row('在访达中显示配置目录', ''),
        sep,
        row('猫配置', 'v0.2', '', '#8E8E93'),
        row('开机启动', '', '✓'),
        sep,
        row('关于 MeowMac', ''),
        row('退出 MeowMac', '⌘Q')
      ]
    };
  }
}
</script>
</body>
</html>
