<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MeowMac 网络页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;color:#1D1D1F;-webkit-font-smoothing:antialiased}
a{color:#0A6CFF}a:hover{color:#0050C8}
</style>
</helmet>
<div style="width: 360px; height: 960px; box-sizing: border-box; background: linear-gradient(rgba(250,250,252,0.8), rgba(250,250,252,0.8)), linear-gradient(135deg, #9DB4F0 0%, #D3B5EC 55%, #F5C3CF 100%); display: flex; flex-direction: column; font-variant-numeric: tabular-nums; color: #1D1D1F;">

  <!-- 总览：状态 -->
  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 12px 16px;">
    <svg width="26" height="17" viewBox="0 0 40 26" aria-hidden="true" style="color: #1D1D1F; flex-shrink: 0;">
      <g fill="currentColor" stroke="currentColor" stroke-linecap="round">
        <path d="M9 13 C9 8.5 14 7 20 7.5 C25 8 28 8.5 29.5 10 L30 15 C28 17.5 23 18 18 17.8 C12.5 17.6 9 16.5 9 13 Z" stroke="none"></path>
        <circle cx="31.5" cy="9.5" r="4.6" stroke="none"></circle>
        <path d="M28.4 6.6 L29.2 2 L32 5.2 Z M32.2 5 L35 1.8 L35.6 6.8 Z" stroke="none"></path>
        <path d="M9.5 11.5 C6 10.5 3.8 8.2 4.4 4.2" fill="none" stroke-width="2.2"></path>
        <path d="M27 16 L32 21 M25 16.5 L29 22 M13 16.5 L7 20 M15.5 17 L10 21.5" fill="none" stroke-width="2.4"></path>
      </g>
    </svg>
    <div style="font-size: 15px; font-weight: 600; flex-grow: 1;">一切正常</div>
    <div style="font-size: 11px; color: #5F5F66;">1 分钟前</div>
  </div>

  <!-- 总览：4 个指标 -->
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding: 0 16px 14px 16px;">
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
      <div style="font-size: 11px; color: #5F5F66;">CPU</div>
      <div style="font-size: 20px; font-weight: 600; line-height: 24px; white-space: nowrap;">24%</div>
      <div style="font-size: 10px; color: #5F5F66; white-space: nowrap;">整机负载</div>
      <div style="height: 3px; border-radius: 2px; background: rgba(120,120,160,0.16); margin-top: 4px;"><div style="width: 24%; height: 3px; border-radius: 2px; background: #0A84FF;"></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
      <div style="font-size: 11px; color: #5F5F66;">内存</div>
      <div style="font-size: 20px; font-weight: 600; line-height: 24px; white-space: nowrap;">69%</div>
      <div style="font-size: 10px; color: #5F5F66; white-space: nowrap;">11 / 16 GB</div>
      <div style="height: 3px; border-radius: 2px; background: rgba(120,120,160,0.16); margin-top: 4px;"><div style="width: 69%; height: 3px; border-radius: 2px; background: #34C759;"></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
      <div style="font-size: 11px; color: #5F5F66;">Claude</div>
      <div style="font-size: 20px; font-weight: 600; line-height: 24px; white-space: nowrap;">72%</div>
      <div style="font-size: 10px; color: #5F5F66; white-space: nowrap;">5 小时 · 剩余</div>
      <div style="height: 3px; border-radius: 2px; background: rgba(120,120,160,0.16); margin-top: 4px;"><div style="width: 72%; height: 3px; border-radius: 2px; background: #34C759;"></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
      <div style="font-size: 11px; color: #5F5F66;">网络</div>
      <div style="font-size: 20px; font-weight: 600; line-height: 24px; white-space: nowrap;">↓2.4M</div>
      <div style="font-size: 10px; color: #5F5F66; white-space: nowrap;">↑128K</div>
      <div style="height: 3px; border-radius: 2px; background: #34C759; margin-top: 4px;"></div>
    </div>
  </div>

  <!-- 标签页 -->
  <div style="padding: 0 16px 12px 16px;">
    <div style="display: flex; gap: 2px; background: rgba(120,120,160,0.12); border-radius: 999px; padding: 3px;">
      <button type="button" style="flex-grow: 1; height: 28px; border: none; border-radius: 999px; background: transparent; font: inherit; font-size: 13px; color: #3A3A3F; display: flex; align-items: center; justify-content: center; gap: 6px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #34C759;"></span>系统</button>
      <button type="button" style="flex-grow: 1; height: 28px; border: none; border-radius: 999px; background: transparent; font: inherit; font-size: 13px; color: #3A3A3F; display: flex; align-items: center; justify-content: center; gap: 6px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #34C759;"></span>额度</button>
      <button type="button" style="flex-grow: 1; height: 28px; border: none; border-radius: 999px; background: rgba(255,255,255,0.88); box-shadow: 0 1px 3px rgba(20,20,60,0.12), inset 0 1px 0 rgba(255,255,255,0.9); font: inherit; font-size: 13px; font-weight: 600; color: #1D1D1F; display: flex; align-items: center; justify-content: center; gap: 6px;"><span style="width: 6px; height: 6px; border-radius: 3px; background: #34C759;"></span>网络</button>
    </div>
  </div>

  <div style="height: 1px; background: rgba(60,60,90,0.1);"></div>

  <!-- 内容区（完整长度，面板里超出部分滚动） -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 12px 16px; overflow: hidden;">

    <!-- 结论 -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#34C759"></circle><path d="M9.5 16.5 L14 21 L22.5 11.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div style="flex-grow: 1;">
          <div style="font-size: 15px; font-weight: 600;">网络正常</div>
          <div style="font-size: 11px; color: #5F5F66;">DNS 走代理 · 5 项检查通过</div>
        </div>
      </div>
      <div style="display: flex; align-items: center;">
        <div style="font-size: 11px; color: #5F5F66; flex-grow: 1;">1 分钟前检测</div>
        <button type="button" style="border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.62); box-shadow: 0 1px 2px rgba(20,20,60,0.08); border-radius: 999px; font: inherit; font-size: 12px; color: #1D1D1F; display: flex; align-items: center; gap: 5px; padding: 4px 12px;">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M13 8 A5 5 0 1 1 11.5 4.5"></path><path d="M13 2.5 V5 H10.5"></path></svg>立即复测
        </button>
      </div>
    </div>

    <div style="height: 1px; background: rgba(60,60,90,0.1);"></div>

    <!-- 连接检查 -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: baseline;">
        <div style="font-size: 13px; font-weight: 600; flex-grow: 1;">连接检查</div>
        <div style="font-size: 11px; color: #5F5F66;">5 / 5 通过</div>
      </div>
      <sc-for list="{{checks}}" as="ck" hint-placeholder-count="5">
        <div style="display: flex; align-items: flex-start; gap: 10px;">
          <span style="width: 7px; height: 7px; border-radius: 4px; background: #34C759; margin-top: 6px; flex-shrink: 0;"></span>
          <div style="flex-grow: 1;">
            <div style="font-size: 13px; font-weight: 600;">{{ck.name}}</div>
            <div style="font-size: 11px; color: #5F5F66;">{{ck.detail}}</div>
          </div>
          <div style="font-size: 11px; color: #1E8E3E; margin-top: 2px;">通过</div>
        </div>
      </sc-for>
    </div>

    <div style="height: 1px; background: rgba(60,60,90,0.1);"></div>

    <!-- 站点连通性 -->
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: baseline; margin-bottom: 4px;">
        <div style="font-size: 13px; font-weight: 600; flex-grow: 1;">站点连通性</div>
        <div style="font-size: 11px; color: #5F5F66;">最近 5 轮</div>
      </div>
      <div style="display: flex; font-size: 10px; color: #5F5F66;">
        <div style="flex-grow: 1;">目标分组</div>
        <div style="width: 64px; text-align: right;">通过</div>
        <div style="width: 88px; text-align: right;">延迟中位数</div>
      </div>
      <sc-for list="{{sites}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; align-items: baseline; height: 24px; font-size: 13px;">
          <div style="flex-grow: 1;">{{s.group}}</div>
          <div style="width: 64px; text-align: right; color: #1E8E3E;">{{s.ok}}</div>
          <div style="width: 88px; text-align: right;">{{s.latency}}<span style="font-size: 11px; color: #5F5F66;"> ms</span></div>
        </div>
      </sc-for>
    </div>

    <div style="height: 1px; background: rgba(60,60,90,0.1);"></div>

    <!-- 出口 IP -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: baseline;">
        <div style="font-size: 13px; font-weight: 600; flex-grow: 1;">出口 IP</div>
        <div style="font-size: 11px; color: #5F5F66;">5 分钟采样一次</div>
      </div>
      <sc-for list="{{egress}}" as="e" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <div style="display: flex; align-items: baseline;">
            <div style="font-size: 13px; flex-grow: 1;">{{e.target}}</div>
            <div style="font-size: 13px; font-weight: 600; font-family: ui-monospace, 'SF Mono', Menlo, monospace;">{{e.ip}}</div>
          </div>
          <div style="display: flex; font-size: 11px; color: #5F5F66;">
            <div style="flex-grow: 1;">{{e.region}}</div>
            <div>{{e.stable}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- 底部操作栏 -->
  <div style="height: 1px; background: rgba(60,60,90,0.1);"></div>
  <div style="display: flex; align-items: center; gap: 8px; padding: 10px 16px;">
    <button type="button" style="border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.62); box-shadow: 0 1px 2px rgba(20,20,60,0.08); border-radius: 999px; font: inherit; font-size: 12px; color: #1D1D1F; display: flex; align-items: center; gap: 5px; padding: 4px 11px;">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M13 8 A5 5 0 1 1 11.5 4.5"></path><path d="M13 2.5 V5 H10.5"></path></svg>刷新
    </button>
    <div style="font-size: 11px; color: #5F5F66; flex-grow: 1; text-align: center;">额度更新于 14:32</div>
    <button type="button" style="border: 1px solid rgba(255,255,255,0.8); background: rgba(255,255,255,0.62); box-shadow: 0 1px 2px rgba(20,20,60,0.08); border-radius: 999px; font: inherit; font-size: 12px; color: #1D1D1F; display: flex; align-items: center; gap: 5px; padding: 4px 9px 4px 11px;">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.5 V3.2 M8 12.8 V14.5 M1.5 8 H3.2 M12.8 8 H14.5 M3.4 3.4 L4.6 4.6 M11.4 11.4 L12.6 12.6 M3.4 12.6 L4.6 11.4 M11.4 4.6 L12.6 3.4" stroke-linecap="round"></path></svg>设置
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="#5F5F66" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 3 L4 5.5 L6.5 3"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      checks: [
        { name: '代理 TUN', detail: '已启用，默认路由经过代理' },
        { name: 'VPN', detail: '已连接，隧道可用' },
        { name: '主网络 DNS', detail: '系统解析器与预期一致' },
        { name: '代理 DNS', detail: '解析请求经过代理' },
        { name: 'Tailnet', detail: '已连接，子网路由可用' }
      ],
      sites: [
        { group: '国内', ok: '3 / 3', latency: '28' },
        { group: '海外', ok: '4 / 4', latency: '142' },
        { group: '子网目标', ok: '2 / 2', latency: '8' }
      ],
      egress: [
        { target: '海外目标 A', ip: '203.0.113.42', region: '日本 · 东京', stable: '12 天未变' },
        { target: '海外目标 B', ip: '203.0.113.57', region: '新加坡', stable: '8 天未变' },
        { target: '国内目标', ip: '203.0.113.18', region: '中国 · 上海', stable: '21 天未变' }
      ]
    };
  }
}
</script>
</body>
</html>
