<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 重置预告 · 紧凑设计</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#ececee;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}header{max-width:1104px;margin:0 auto 24px}h1{font-size:22px;margin:0 0 8px}header p{font-size:13px;color:#626268;margin:0;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,360px);justify-content:center;gap:24px}.sample{width:360px}.sample>h2{font-size:12px;font-weight:500;color:#626268;margin:0 0 8px}.panel{--text:#1d1d1f;--sub:#626268;--rule:#d6d6db;--track:#dedee3;--warn:#b25000;--blue:#0a6cff;background:#fafafc;color:var(--text);border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #15152c12;font-variant-numeric:tabular-nums}.dark{--text:#f5f5f7;--sub:#a8a8af;--rule:#404047;--track:#414148;--warn:#ff9f0a;--blue:#64aaff;background:#242427}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}.top{padding:14px 16px 12px;font-size:15px;font-weight:600}.muted{color:var(--sub);font-size:11px;font-weight:400}.tabs{margin:0 16px 12px;padding:3px;background:var(--track);border-radius:18px;display:flex;font-size:13px}.tabs span{flex:1;text-align:center;padding:5px}.tabs .active{background:var(--text);color:var(--track);border-radius:15px;font-weight:600}.content{padding:12px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rule)}.providers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;text-align:center}.providers span{padding:7px 4px;border:1px solid var(--rule);border-radius:12px;color:var(--sub)}.providers .selected{border-color:var(--text);color:var(--text);font-weight:600}h3{font-size:13px;font-weight:600;margin:0}.account{font-size:15px;font-weight:600}.window{display:flex;flex-direction:column;gap:5px}.value{font-size:15px;font-weight:600}.line{height:6px;background:var(--track);border-radius:3px}.rule{height:1px;background:var(--rule)}.forecast{display:flex;align-items:baseline;gap:6px;line-height:16px}.forecast-text{flex:1;min-width:0;font-size:11px}.main-line{display:flex;min-width:0}.forecast-time{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.type-line{margin-top:2px;line-height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.forecast-text strong{flex-shrink:0;font-size:13px;font-weight:600}.warn{color:var(--warn)}.link{flex-shrink:0;font-size:11px;color:var(--blue);text-decoration:none;white-space:nowrap}.foot{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--rule);font-size:12px}.button{border:1px solid var(--rule);border-radius:16px;padding:4px 10px}@media(max-width:400px){body{padding:16px 0}header{padding:0 16px}}
</style>
<header><h1>Codex 重置预告</h1><p>预告显示估算时间、类型和来源；最近确认单列，使用确认消息时间或发生日期。获取时间单独显示。360px 宽度下通常占一至两行；单条预告本体不超过 40pt。数据均为虚构示例，背景为模拟材质。</p></header>
<main class="grid" id="samples"></main>
<script>
const states=[
 {name:"预告",text:"估算 10/8 20:00～23:00 · 额度重置"},
 {name:"暂无预告",text:"暂无"},
 {name:"最近确认",text:"暂无",confirmed:"10/7 11:35 · 额度重置"},
 {name:"预告和确认并存",text:"估算 10/8 20:00～23:00 · 额度重置",confirmed:"10/7 11:35 · 额度重置"},
 {name:"已过估算窗口",text:"估算 10/7 20:00～23:00 · 重置卡发放",help:"预计窗口已过，尚未确认。"},
 {name:"缺少估算时间",text:"时间待估算 · 额度重置"},
 {name:"首次等待",text:"等待采集"},
 {name:"采集失败，无缓存",text:"获取失败",warn:true},
 {name:"采集失败，有缓存",wrap:true,text:"缓存 · 估算 10/8 20:00～23:00 · 额度重置",warn:true},
 {name:"长类型",wrap:true,text:"估算 10/8 20:00～23:00 · "+"示例类型".repeat(80)},
 {name:"长日期说明",wrap:true,text:"估算 "+"示例日期".repeat(80)+" · 额度重置"}
];
function make(c,dark){const split=c.text.lastIndexOf(" · ");const content=c.wrap?`<div class="main-line"><strong>重置预告：</strong><span class="forecast-time">${c.text.slice(0,split)}</span></div><div class="type-line">${c.text.slice(split+3)}</div>`:`<strong>重置预告：</strong>${c.text}`;const node=document.createElement("section");node.className="sample";node.innerHTML=`<h2>${c.name} · ${dark?"深色":"浅色"}</h2><div class="panel ${dark?"dark":""}"><div class="top bar"><span>一切正常</span><span class="muted">1 分钟前</span></div><div class="tabs"><span>系统</span><span class="active">额度</span><span>网络</span></div><div class="content"><div class="providers"><span>Claude</span><span class="selected">Codex</span><span>DeepSeek</span><span>OpenCode Go</span></div><div class="bar"><span class="account">Codex · Plus</span><span class="muted">10:00 更新</span></div><div class="window"><div class="bar"><h3>每周窗口</h3><span class="value">剩余 64%</span></div><div class="line"></div><div class="bar muted"><span>节奏正常</span><span>10/11 08:00 重置</span></div></div><div class="rule"></div><div class="forecast"><div class="forecast-text ${c.warn?"warn":""}" title="${c.help||"AIHOT 估算，非官方承诺。公开消息不代表当前账号已到账。"}">${content}</div><a class="link" href="https://aihot.news/codex-reset" target="_blank" rel="noreferrer">查看来源 ↗</a></div>${c.confirmed?`<div class="forecast"><div class="forecast-text"><strong>最近确认：</strong>${c.confirmed}</div><a class="link" href="https://aihot.news/codex-reset">查看来源 ↗</a></div>`:""}${!["首次等待","采集失败，无缓存"].includes(c.name)?`<div class="muted">获取于 10/8 10:00 · 每 6 小时更新</div>`:""}<div class="rule"></div><div class="bar"><h3>用量趋势</h3><span class="muted">MeowMac 采样</span></div><div class="muted">后续功能块沿用现有布局</div></div><div class="foot"><span class="button">刷新</span><span class="muted">额度更新于 10:00</span><span class="button">设置</span></div></div>`;return node}
document.getElementById("samples").append(...states.flatMap(c=>[make(c,false),make(c,true)]));
</script>
</html>
