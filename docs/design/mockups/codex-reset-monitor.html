<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codex 额外重置监控 · 设计草稿</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#ececee;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}header{max-width:1104px;margin:0 auto 24px}h1{font-size:22px;margin:0 0 8px}header p{font-size:13px;color:#626268;margin:0;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,360px);justify-content:center;gap:24px}.sample{width:360px}.sample>h2{font-size:12px;font-weight:500;color:#626268;margin:0 0 8px}.panel{--text:#1d1d1f;--sub:#626268;--rule:#d6d6db;--track:#dedee3;--warn:#b25000;--blue:#0a6cff;background:#fafafc;color:var(--text);border-radius:16px;overflow:hidden;box-shadow:0 5px 18px #15152c12;font-variant-numeric:tabular-nums}.dark{--text:#f5f5f7;--sub:#a8a8af;--rule:#404047;--track:#414148;--warn:#ff9f0a;--blue:#64aaff;background:#242427}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}.top{padding:14px 16px 12px;font-size:15px;font-weight:600}.muted{color:var(--sub);font-size:11px;font-weight:400}.tabs{margin:0 16px 12px;padding:3px;background:var(--track);border-radius:18px;display:flex;font-size:13px}.tabs span{flex:1;text-align:center;padding:5px}.tabs .active{background:var(--text);color:var(--track);border-radius:15px;font-weight:600}.content{padding:12px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rule)}.providers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;text-align:center}.providers span{padding:7px 4px;border:1px solid var(--rule);border-radius:12px;color:var(--sub)}.providers .selected{border-color:var(--text);color:var(--text);font-weight:600}h3{font-size:13px;font-weight:600;margin:0}.account{font-size:15px;font-weight:600}.window{display:flex;flex-direction:column;gap:5px}.value{font-size:15px;font-weight:600}.line{height:6px;background:var(--track);border-radius:3px;overflow:hidden}.line:before{content:"";display:block;width:64%;height:6px;background:var(--text);border-radius:3px}.rule{height:1px;background:var(--rule)}.monitor{display:flex;flex-direction:column;gap:6px}.status{font-size:13px;font-weight:600;line-height:1.5}.warn{color:var(--warn)}.detail{font-size:11px;line-height:1.6;color:var(--sub);overflow-wrap:anywhere}.record{display:flex;flex-direction:column;gap:3px;padding-top:4px}.link{font-size:11px;color:var(--blue);text-decoration:none}.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--sub);line-height:1.5}.foot{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--rule);font-size:12px}.button{border:1px solid var(--rule);border-radius:16px;padding:4px 10px}.notice{font-size:10px;line-height:1.6;color:var(--sub)}@media(max-width:400px){body{padding:16px 0}header{padding:0 16px}}
</style>
<header><h1>Codex 额外重置监控</h1><p>设计草稿。数据均为虚构示例。新增分节放在额度窗口和可重置次数之后、用量趋势之前。下方展示 360px 宽度；背景为模拟材质，原生效果由用户实机验收。</p></header>
<main class="grid" id="samples"></main>
<script>
const cases=[
 {name:"预告 · 浅色",status:"有重置预告 · 尚未确认",tone:"",detail:"额度重置 · 适用范围：付费 Codex 用户",time:"公告时间：10/8 20:00～22:00",estimate:"AIHOT 估算：10/8 20:00～23:00",recent:"最近确认：10/5 07:20 · 额度重置",health:"一切正常"},
 {name:"预告 · 深色",dark:true,status:"有重置预告 · 尚未确认",detail:"额度重置 · 适用范围：付费 Codex 用户",time:"公告时间：10/8 20:00～22:00",estimate:"AIHOT 估算：10/8 20:00～23:00",recent:"最近确认：10/5 07:20 · 额度重置",health:"一切正常"},
 {name:"暂无预告 · 浅色",status:"暂无重置预告",detail:"最近 7 天内有已确认记录。",time:"",recent:"最近确认：10/5 07:20 · 重置卡发放",scope:"适用范围未说明",health:"一切正常"},
 {name:"暂无预告 · 深色",dark:true,status:"暂无重置预告",detail:"最近 7 天内有已确认记录。",time:"",recent:"最近确认：10/5 07:20 · 重置卡发放",scope:"适用范围未说明",health:"一切正常"},
 {name:"已过预计窗口 · 浅色",status:"预计窗口已过 · 尚未确认",tone:"warn",detail:"额度重置 · 适用范围未说明",time:"公告时间：10/7 晚间（时区为推断）",estimate:"AIHOT 估算：10/8 08:00～10:00",recent:"最近确认：10/5 07:20 · 额度重置",health:"一切正常",source:"站点采集有延迟"},
 {name:"采集失败 · 深色",dark:true,status:"采集失败 · 保留上次结果",tone:"warn",detail:"上次结果：暂无重置预告",recent:"最近确认：10/5 07:20 · 重置卡发放",health:"提醒 · 重置监控采集失败",fetched:"上次成功：09:40",source:"达到现有连续失败阈值后参与提醒"}
];
function make(c){const node=document.createElement("section");node.className="sample";node.innerHTML=`<h2>${c.name}</h2><div class="panel ${c.dark?"dark":""}"><div class="top bar"><span>${c.health}</span><span class="muted">1 分钟前</span></div><div class="tabs"><span>系统</span><span class="active">额度</span><span>网络</span></div><div class="content"><div class="providers"><span>Claude</span><span class="selected">Codex</span><span>DeepSeek</span><span>OpenCode Go</span></div><div class="bar"><span class="account">Codex · Plus</span><span class="muted">10:00 更新</span></div><div class="window"><div class="bar"><h3>每周窗口</h3><span class="value">剩余 64%</span></div><div class="line"></div><div class="bar muted"><span>节奏正常</span><span>10/11 08:00 重置</span></div></div><div class="rule"></div><section class="monitor"><div class="bar"><h3>额外重置监控</h3><span class="muted">每 6 小时</span></div><div class="status ${c.tone||""}">${c.status}</div><div class="detail">${c.detail}</div>${c.time?`<div class="detail">${c.time}</div>`:""}${c.estimate?`<div class="detail">${c.estimate}（非官方承诺）</div>`:""}<div class="record"><div class="detail">${c.recent}</div>${c.scope?`<div class="detail">${c.scope}</div>`:""}</div><div class="notice">公开消息不代表当前账号已到账。</div><div class="meta"><span>${c.fetched||"获取：10:00"}</span><span>站点核验：09:55</span></div>${c.source?`<div class="detail warn">${c.source}</div>`:""}<a class="link" href="https://aihot.news/codex-reset" target="_blank" rel="noreferrer">AIHOT · 查看来源 ↗</a></section><div class="rule"></div><div class="bar"><h3>用量趋势</h3><span class="muted">MeowMac 采样</span></div><div class="muted">后续功能块沿用现有布局</div></div><div class="foot"><span class="button">刷新</span><span class="muted">额度更新于 10:00</span><span class="button">设置</span></div></div>`;return node}
document.getElementById("samples").append(...cases.map(make));
</script>
</html>
