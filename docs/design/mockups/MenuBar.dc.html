<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MeowMac 菜单栏猫</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;color:#1D1D1F;-webkit-font-smoothing:antialiased}
a{color:#0A6CFF}a:hover{color:#0050C8}
</style>
</helmet>
<div style="width: 1680px; height: 460px; box-sizing: border-box; background: #FFFFFF; padding: 40px 48px; display: flex; flex-direction: column; gap: 32px;">

  <!-- 菜单栏里的实际尺寸 -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px;">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="height: 30px; background: #E9E8EC; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 14px;">
          <svg width="28" height="18" viewBox="0 0 44 28" aria-label="{{b.label}}">
            <g fill="{{b.catColor}}" stroke="{{b.catColor}}" stroke-linecap="round">
              <path d="{{b.body}}" stroke="none"></path>
              <circle cx="{{b.hx}}" cy="{{b.hy}}" r="4.5" stroke="none"></circle>
              <path d="{{b.ears}}" stroke="none"></path>
              <path d="{{b.tail}}" fill="none" stroke-width="2.2"></path>
              <path d="{{b.legs}}" fill="none" stroke-width="2.4"></path>
              <path d="{{b.speed}}" fill="none" stroke-width="1.3"></path>
            </g>
            <circle cx="39.5" cy="5" r="{{b.badge}}" fill="#FF9500"></circle>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 4.5 C5 0.5 11 0.5 15 4.5 M3.5 7 C6 4.6 10 4.6 12.5 7 M6 9.5 C7.2 8.4 8.8 8.4 10 9.5" fill="none" stroke="#1D1D1F" stroke-width="1.5" stroke-linecap="round"></path></svg>
          <svg width="24" height="12" viewBox="0 0 24 12" aria-hidden="true"><rect x="0.75" y="0.75" width="20" height="10.5" rx="3" fill="none" stroke="#1D1D1F" stroke-width="1.2"></rect><rect x="2.5" y="2.5" width="13" height="7" rx="1.5" fill="#1D1D1F"></rect><rect x="21.8" y="4" width="1.6" height="4" rx="0.8" fill="#1D1D1F"></rect></svg>
          <div style="font-size: 13px; font-weight: 500;">9月30日 周二 10:42</div>
        </div>
        <div style="font-size: 13px; font-weight: 600;">{{b.title}}</div>
        <div style="font-size: 12px; color: #5F5F66;">{{b.desc}}</div>
      </div>
    </sc-for>
  </div>

  <div style="height: 1px; background: rgba(0,0,0,0.08);"></div>

  <!-- 放大的帧 -->
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 24px;">
    <sc-for list="{{frames}}" as="f" hint-placeholder-count="7">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="height: 110px; background: #F4F3F6; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
          <svg width="150" height="95" viewBox="0 0 44 28" aria-label="{{f.label}}">
            <g fill="{{f.color}}" stroke="{{f.color}}" stroke-linecap="round">
              <path d="{{f.body}}" stroke="none"></path>
              <circle cx="{{f.hx}}" cy="{{f.hy}}" r="4.5" stroke="none"></circle>
              <path d="{{f.ears}}" stroke="none"></path>
              <path d="{{f.tail}}" fill="none" stroke-width="2.2"></path>
              <path d="{{f.legs}}" fill="none" stroke-width="2.4"></path>
              <path d="{{f.speed}}" fill="none" stroke-width="1.3"></path>
              <path d="{{f.zz}}" fill="none" stroke-width="1.1"></path>
            </g>
            <circle cx="39.5" cy="5" r="{{f.badge}}" fill="#FF9500"></circle>
          </svg>
        </div>
        <div style="font-size: 13px; font-weight: 600;">{{f.title}}</div>
        <div style="font-size: 12px; color: #5F5F66;">{{f.desc}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1680,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    const run = (dy, legs, tail) => ({
      body: 'M9 ' + (15 + dy) + ' C9 ' + (10.5 + dy) + ' 14 ' + (9 + dy) + ' 20 ' + (9.5 + dy) + ' C25 ' + (10 + dy) + ' 28 ' + (10.5 + dy) + ' 29.5 ' + (12 + dy) + ' L30 ' + (17 + dy) + ' C28 ' + (19.5 + dy) + ' 23 ' + (20 + dy) + ' 18 ' + (19.8 + dy) + ' C12.5 ' + (19.6 + dy) + ' 9 ' + (18.5 + dy) + ' 9 ' + (15 + dy) + ' Z',
      hx: 31.5, hy: 11.5 + dy,
      ears: 'M28.4 ' + (8.6 + dy) + ' L29.2 ' + (4 + dy) + ' L32 ' + (7.2 + dy) + ' Z M32.2 ' + (7 + dy) + ' L35 ' + (3.8 + dy) + ' L35.6 ' + (8.8 + dy) + ' Z',
      tail, legs, zz: '', speed: ''
    });
    const f1 = run(0, 'M27 18 L32 23 M25 18.5 L29 24 M13 18.5 L7 22 M15.5 19 L10 23.5', 'M9.5 13.5 C6 12.5 3.8 10.2 4.4 6.2');
    const f2 = run(0.8, 'M27 18.8 L27.5 25 M25 19.3 L24 25 M13 19.3 L12 25 M15.5 19.8 L16.5 25', 'M9.5 14.3 C6 13.8 4 12.3 3.6 8.8');
    const f3 = run(0.4, 'M27 18.4 L24.5 24.6 M25 18.9 L22 24 M13 18.9 L16.5 24.6 M15.5 19.4 L19.5 24.3', 'M9.5 13.9 C6 13.9 4.2 12.9 3.2 10.4');
    const f4 = run(-0.8, 'M27 17.2 L30.5 20.4 M25 17.7 L27.5 21.4 M13 17.7 L9.5 20.4 M15.5 18.2 L12.5 21.4', 'M9.5 12.7 C6 11.2 4.5 8.2 5.5 4.7');
    const f5 = run(-0.3, 'M27 17.7 L31.5 21.9 M25 18.2 L27 23.4 M13 18.2 L8.5 22.4 M15.5 18.7 L13 23.9', 'M9.5 13.2 C6 11.9 4 9.5 4.6 6.3');
    const lying = {
      body: 'M7 24.5 C7 18.5 12 16 19 16 C25 16 28.5 17.5 29.5 20 L29.5 24.5 Z',
      hx: 31, hy: 20,
      ears: 'M27.8 17.3 L28.4 12.9 L31 15.9 Z M31.6 15.7 L34.4 12.7 L34.8 17.5 Z',
      tail: 'M7.5 23.5 C4 23.5 3 26 5.5 26.2 L20 26.2',
      legs: '',
      zz: 'M34 5 H37 L34 8 H37 M38.5 1.5 H40.5 L38.5 3.5 H40.5',
      speed: ''
    };
    const ink = '#1D1D1F';
    const red = '#FF3B30';
    const orange = '#FF9500';
    const lines = 'M0.6 16 H3.2 M0 19.5 H2.6 M0.6 23 H3.2';
    const frames = [
      { ...f1, color: ink, badge: 0, title: '帧 1 · 伸展', desc: '前腿前伸，后腿后蹬', label: '奔跑第 1 帧' },
      { ...f2, color: ink, badge: 0, title: '帧 2 · 落地', desc: '四腿收到身下', label: '奔跑第 2 帧' },
      { ...f3, color: ink, badge: 0, title: '帧 3 · 蹬地', desc: '前腿后摆，后腿前收', label: '奔跑第 3 帧' },
      { ...f4, color: ink, badge: 0, title: '帧 4 · 腾空', desc: '身体上移，四腿收起', label: '奔跑第 4 帧' },
      { ...f5, color: ink, badge: 0, title: '帧 5 · 过渡', desc: '回到伸展前的姿势', label: '奔跑第 5 帧' },
      { ...f3, speed: lines, color: orange, badge: 0, title: '提醒', desc: '整只猫变橙色；速度仍随负载变化', label: '提醒状态' },
      { ...lying, color: red, badge: 0, title: '严重', desc: '趴下不动，红色，单帧', label: '严重状态' }
    ];
    const bars = [
      { ...f1, catColor: ink, badge: 0, title: '正常', desc: '模板图，跟随菜单栏深浅色。负载越高帧间隔越短：0.5 秒到 0.05 秒。', label: '正常状态' },
      { ...f3, speed: lines, catColor: orange, badge: 0, title: '提醒', desc: '整只猫变成橙色。颜色表示有提醒，速度仍表示负载：此例负载高，所以跑得很快，身后有速度线。', label: '提醒状态' },
      { ...lying, catColor: red, badge: 0, title: '严重', desc: '彩色图，停止动画。只在 DNS 泄漏这类严重问题时出现。', label: '严重状态' }
    ];
    return { frames, bars };
  }
}
</script>
</body>
</html>
