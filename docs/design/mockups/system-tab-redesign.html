<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeowMac · 系统页设计稿</title>
<style>
:root{--ink:#222326;--sub:#707177;--line:#d2d4d9;--fill:#eceef2;--panel:#f6f7fa;--surface:linear-gradient(180deg,#f0f5fa 0%,#ffffff 45%,#fff3e8 100%);--blue:#007aff;--purple:#af52de;--teal:#239cac;--indigo:#5856d6;--pink:#ff2d55;--brown:#a2845e;--green:#1e8e3e;--orange:#b25000;--heat:#ff9500;--gray:#8e8e93}
*{box-sizing:border-box}body{margin:0;padding:28px;background:#dddfe4;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#222326;-webkit-font-smoothing:antialiased}header{max-width:1512px;margin:0 auto 22px}h1{font-size:22px;font-weight:600;margin:0 0 8px}header p{font-size:13px;color:#60636b;margin:6px 0;line-height:1.6}.controls{display:flex;gap:6px;margin-top:16px}.controls button{cursor:pointer;border:1px solid #babec7;border-radius:30px;background:#f9fafc;padding:6px 12px;color:#444;font-family:inherit;font-size:12px}.controls button.active{background:#303238;color:#fff;border-color:#303238}
.grid{display:flex;gap:24px;flex-wrap:wrap;max-width:1512px;margin:auto;align-items:flex-start}.sample{width:360px}.sample h2{font-size:12px;font-weight:500;margin:0 0 10px;color:#5d6068}.panel{width:360px;border:1px solid #b7bbc3;border-radius:18px;overflow:hidden;background:var(--surface);color:var(--ink);box-shadow:0 12px 32px #00000012;font-variant-numeric:tabular-nums}.dark{--ink:#f0f1f4;--sub:#a3a5ac;--line:#414349;--fill:#303238;--panel:#202125;--surface:#202125;--blue:#0a84ff;--purple:#bf5af2;--teal:#3ecbd6;--indigo:#8583ff;--pink:#ff6485;--brown:#c7a27c;--green:#30d158;--orange:#ff9f0a;--gray:#a0a2aa;border-color:#55585f}.head{padding:14px 15px 0}.status,.row{display:flex;align-items:center;gap:6px}.status{font-size:15px;font-weight:600;line-height:20px}.status svg{width:24px;height:16px;fill:var(--ink);margin-right:5px}.right{margin-left:auto}.sub{color:var(--sub);font-size:10px;font-weight:400}.reminders{font-size:11px;margin:10px 0 13px;display:flex;justify-content:space-between}.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.overview .label{font-size:11px;color:var(--sub)}.overview .value{font-size:20px;line-height:25px;font-weight:600;white-space:nowrap}.overview .detail{font-size:10px;line-height:16px;color:var(--sub);white-space:nowrap}.bar{height:3px;background:var(--fill);border-radius:3px;overflow:hidden;margin-top:4px}.bar i{height:100%;display:block;border-radius:3px;background:var(--green)}.tabs{display:flex;padding:3px;border:1px solid var(--line);background:var(--fill);border-radius:40px;margin:14px 0 12px}.tabs span{flex:1;font-size:13px;line-height:23px;text-align:center}.tabs span.on{background:var(--panel);border-radius:30px;font-weight:600}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;flex-shrink:0}.body{border-top:1px solid var(--line);padding:12px 15px;display:flex;flex-direction:column;gap:12px;max-height:594px;overflow:auto}.section+.section{border-top:1px solid var(--line);padding-top:12px}.heading{display:flex;align-items:center;font-size:13px;font-weight:600;min-height:22px;margin-bottom:8px}.selector{display:flex;border:1px solid var(--line);padding:2px;background:var(--fill);border-radius:24px}.selector span{font-size:11px;padding:2px 8px;color:var(--sub);font-weight:500}.selector .on{background:var(--panel);border-radius:20px;color:var(--ink);font-weight:600}.metric{margin-bottom:2px}.metric:last-of-type{margin-bottom:0}.metric .row{font-size:12px;line-height:16px;margin-bottom:2px}.metric .name{font-weight:500}.metric .value{font-size:13px;font-weight:600;white-space:nowrap}.metric .secondary{font-size:10px;color:var(--sub);white-space:nowrap}.graph{height:18px;width:100%;display:block}.axis{display:flex;justify-content:space-between;color:var(--sub);font-size:10px;margin-top:5px;line-height:13px}.legend{font-size:10px;color:var(--sub);display:flex;gap:5px;align-items:center;margin-top:5px;line-height:14px}.legend .heat{width:7px;height:7px;background:var(--heat);opacity:.35;flex-shrink:0}.ranking{width:100%;border-collapse:collapse;table-layout:fixed}.ranking th{font-size:10px;font-weight:400;color:var(--sub);height:16px;text-align:left}.ranking td{font-size:13px;height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ranking th:first-child,.ranking td:first-child{width:20px;font-size:11px;color:var(--sub)}.ranking th:nth-child(3),.ranking td:nth-child(3){width:58px;text-align:right}.ranking th:last-child,.ranking td:last-child{width:52px;text-align:right}.ranking .hot td{color:var(--orange);font-weight:600}.pill{border:1px solid var(--line);background:var(--fill);border-radius:30px;padding:3px 10px;font-size:12px;line-height:16px;color:var(--ink)}.disk-title{margin-bottom:3px}.disk-title strong{font-size:20px;font-weight:600;margin-left:2px}.disk-title .unit{font-size:11px;color:var(--sub);font-weight:400}.disk-delta{font-size:10px;color:var(--sub);margin:0 0 5px;line-height:13px}.disk-graph{height:20px}.disk .capacity{height:4px;margin:7px 0 4px}.disk .capacity i{background:var(--gray)}.disk-meta{justify-content:space-between;font-size:10px;color:var(--sub);line-height:14px}.clean-record{margin-top:5px;font-size:10px;color:var(--sub);line-height:14px}.footer{border-top:1px solid var(--line);padding:10px 15px;display:flex;align-items:center;gap:8px}.footer .sub{flex:1;text-align:center}.diagnosis{background:color-mix(in srgb,var(--heat) 12%,transparent);padding:9px 10px;border-radius:10px}.diagnosis .row{font-size:11px;line-height:18px}.diagnosis .title{font-size:13px;font-weight:600;margin-bottom:3px}.diagnosis .hint{font-size:10px;line-height:14px;color:var(--sub);margin-top:5px}.warn{color:var(--orange)}.note{font-size:11px;color:#5d6068;line-height:1.6;margin-top:10px}.single header,.single .sample:not(.chosen){display:none}.single{padding:0;background:transparent}.single .grid{margin:0}.single h2,.single .note{display:none}.single .panel{border-radius:18px}
</style>
<header><h1>系统页：把时间留给曲线</h1><p>每项指标的标签和读数移到曲线上方，绘图区扩至 328 pt。CPU、内存、功耗、温度和风扇仍共用时间轴。</p><p>磁盘增加可用容量趋势，保留容量条、清理入口和历史记录。所有数值均为合成数据；系统、额度和网络共用浅色面板底色；此稿模拟网络稿的玻璃效果，真实材质由应用呈现。</p><div class="controls"><button class="active" data-range="60">1 小时</button><button data-range="15">15 分钟</button></div></header>
<div class="grid" id="root"></div>
<script>
const N=91;let minutes=60;
const series=(base,amp,phase,spike=0)=>Array.from({length:N},(_,i)=>base+amp*Math.sin(i/7+phase)+amp*.4*Math.sin(i/2.1)+((i%23===12)?spike:0));
const D={cpu:series(22,7,0,14),memory:series(11.2,.22,1),power:series(8,2,2,4),temperature:series(39,2.5,1,7),battery:series(31,.3,2),fan:Array(N).fill(0),disk:Array.from({length:N},(_,i)=>192-i*.03+(i>=58?6.9:0))};
D.disk[N-1]=196.2;D.cpu[N-1]=24;D.memory[N-1]=11.2;D.power[N-1]=8.6;D.temperature[N-1]=42.6;D.battery[N-1]=31;
function graph(key,color,{fill=false,second=false,threshold=false,sparse=false,warm=false,disk=false}={}){
 const [lo,hi]=({cpu:[0,100],memory:[0,16],power:[0,40],temperature:[28,52],fan:[0,6000],disk:[190,198]})[key];
 let s='<svg class="graph '+(disk?'disk-graph':'')+'" viewBox="0 0 328 24" preserveAspectRatio="none" aria-label="'+({cpu:'CPU',memory:'内存',power:'整机功耗',temperature:'温度',fan:'风扇',disk:'磁盘可用空间'})[key]+'趋势">';
 if(sparse)s+='<defs><pattern id="hatch-'+key+'-'+color+'" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M-1 1L1-1 M0 6L6 0 M5 7L7 5" stroke="var(--sub)" opacity=".18" stroke-width=".7"/></pattern></defs><rect width="298" height="24" fill="url(#hatch-'+key+'-'+color+')"/>';
 if(warm)s+='<rect x="160" width="60" height="24" fill="var(--heat)" opacity=".16"/>';
 [0,164,327.5].forEach(x=>s+='<path d="M'+x+' 0V24" stroke="var(--line)" stroke-width=".5"/>');s+='<path d="M0 23.5H328" stroke="var(--line)" stroke-width=".7"/>';
 if(threshold)s+='<path d="M0 5H328" stroke="var(--sub)" stroke-width=".7" stroke-dasharray="3 3"/>';
 function line(values,c,area){const start=sparse?N-9:(minutes===15?N-23:0);const count=N-start;const width=sparse?328*5/minutes:328;const left=328-width;const pts=values.slice(start).map((v,i)=>[left+i/(count-1)*width,Math.max(1,Math.min(23,23-(v-lo)/(hi-lo)*22))]);const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');if(area)s+='<path d="'+path+'L328 24L'+left+' 24Z" fill="var(--'+c+')" opacity=".1"/>';s+='<path d="'+path+'" fill="none" stroke="var(--'+c+')" stroke-width="1.3" stroke-linejoin="round"/>';const p=pts[pts.length-1];s+='<circle cx="'+Math.min(326.5,p[0])+'" cy="'+p[1]+'" r="1.5" fill="var(--'+c+')"/>';}
 line(D[key],color,fill);if(second)line(D.battery,'pink',false);return s+'</svg>';
}
function header(alert){return `<div class="head"><div class="status"><svg viewBox="0 0 36 18"><path d="M2 6l6 2 9-2 7 2 6-4 2 2-4 5 6 3-1 1-8-2-5 2-1-2-6-1-4 4H6l4-6-6-2z"/></svg><span class="${alert?'warn':''}">${alert?'提醒 · 进程 CPU 持续偏高':'一切正常'}</span><span class="sub right">刚刚</span></div><div class="reminders"><b>全部提醒 · ${alert?'1':'0'} 项</b><span>›</span></div><div class="overview">${[['CPU','24%','整机负载',24,'blue'],['内存','48%','已用 11 / 16 GB',48,'green'],['Claude','72%','5 小时 · 剩余',72,'green'],['网络','↓128K','↑32K',100,'green']].map(x=>`<div><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="detail">${x[2]}</div><div class="bar"><i style="width:${x[3]}%;background:var(--${x[4]})"></i></div></div>`).join('')}</div><div class="tabs"><span class="on"><i class="dot" style="background:var(--${alert?'orange':'green'})"></i>系统</span><span><i class="dot"></i>额度</span><span><i class="dot"></i>网络</span></div></div>`;}
function trends(sparse,alert){let data=[['cpu','blue','CPU','整机负载','24%',''],['memory','purple','内存','已用 / 16 GB','11.2 GB',''],['power','teal','整机功耗','0–40 W','8.6 W',''],['temperature','indigo','温度','最热 44.8 · GPU 41.2','42.6 °C','电池 31.0'],['fan','brown','风扇','静止','0 rpm','']];return `<section class="section trends"><div class="heading">系统趋势<div class="selector right"><span class="${minutes===15?'on':''}">15 分钟</span><span class="${minutes===60?'on':''}">1 小时</span></div></div>${data.map(x=>`<div class="metric"><div class="row"><i class="dot" style="background:var(--${x[1]});margin:0"></i><span class="name">${x[2]}</span><span class="sub">${x[3]}</span><span class="value right">${x[4]}</span>${x[5]?'<span class="secondary">'+x[5]+'</span>':''}</div>${graph(x[0],x[1],{fill:x[0]==='memory',second:x[0]==='temperature',threshold:x[0]==='fan',sparse,warm:alert})}</div>`).join('')}<div class="axis"><span>${minutes===60?'13:00':'13:45'}</span><span>${minutes===60?'13:30':'13:52'}</span><span>14:00</span></div><div class="legend"><i class="heat"></i><span>热状态 fair 及以上的时段</span><span class="right">同一时间轴</span></div>${sparse?'<div class="legend">斜纹：无记录 · 已采集 5 分钟</div>':''}</section>`;}
function energy(alert){return `<section class="section energy"><div class="heading" style="margin-bottom:3px">能耗排行<span class="sub right">前 5 名</span></div><table class="ranking"><thead><tr><th></th><th>进程</th><th>CPU</th><th>影响分</th></tr></thead><tbody>${(alert?[['ExampleWorker','96.2%','83.1'],['WindowServer','12.4%','18.2'],['ExampleSync','5.8%','9.1'],['Finder','2.1%','3.4'],['kernel_task','1.4%','2.8']]:[['WindowServer','12.4%','18.2'],['ExampleSync','5.8%','9.1'],['Finder','2.1%','3.4'],['kernel_task','1.4%','2.8'],['ExampleWorker','0.2%','0.4']]).map((x,i)=>`<tr class="${alert&&i===0?'hot':''}"><td>${i+1}</td><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table></section>`;}
function disk(sparse){return `<section class="section disk"><div class="heading disk-title">磁盘 <strong>196</strong><span class="unit">GB 可用</span><span class="pill right">清理…</span></div><div class="disk-delta">190–198 GB · 近 ${minutes===60?'1 小时':'15 分钟'}<span style="float:right">${sparse?'记录不足':minutes===60?'增加 4.2 GB':'减少 0.7 GB'}</span></div>${graph('disk','gray',{fill:true,sparse,disk:true})}<div class="capacity bar"><i style="width:60.8%"></i></div><div class="row disk-meta"><span>已用 304 GB</span><span>共 500 GB</span></div><div class="clean-record">上次清理：9 月 28 日 · 释放 6.8 GB</div></section>`;}
function diag(){return '<div class="diagnosis"><div class="title">能耗诊断</div><div class="row"><b>ExampleWorker</b><span class="sub">占满 1 核</span><b class="right warn">96%</b><span class="sub">20 分钟</span></div><div class="hint">建议用 AI 诊断：把进程名和数值交给 AI 助手排查</div></div>';}
function render(){document.querySelector('#root').innerHTML=[['normal-dark','dark','正常 · 深色',false,false],['normal-light','','正常 · 浅色',false,false],['alert-dark','dark','1 项诊断 · 深色',true,false],['sparse-dark','dark','刚启动 · 记录不足',false,true]].map(([id,theme,title,alert,sparse])=>`<article class="sample" id="${id}"><h2>${title}</h2><div class="panel ${theme}">${header(alert)}<div class="body">${alert?diag():''}${trends(sparse,alert)}${energy(alert)}${disk(sparse)}</div><div class="footer"><span class="pill">↻ 刷新</span><span class="sub">额度更新于 13:57</span><span class="pill">⚙ 设置</span></div></div><p class="note">${alert?'首屏保留诊断、趋势和完整排行；磁盘可滚动到达。':sparse?'时间窗口保持所选范围，不补齐或拉伸缺失记录。':'正常状态完整显示趋势、排行和磁盘。'}</p></article>`).join('');const only=new URLSearchParams(location.search).get('panel');if(only){document.body.classList.add('single');document.getElementById(only)?.classList.add('chosen');}}
render();document.querySelectorAll('[data-range]').forEach(b=>b.addEventListener('click',()=>{minutes=Number(b.dataset.range);document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x===b));render();}));
</script>
</html>
